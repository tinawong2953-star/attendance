<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>出缺勤與請假/加班申請單</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --border-color: #333;
            --light-bg: #f8f9fa;
            --alert-bg: #fff3cd;
            --alert-border: #ffeeba;
            --alert-text: #856404;
        }

        body {
            font-family: "Microsoft JhengHei", "微軟正黑體", Arial, sans-serif;
            background-color: #eef2f5;
            margin: 0;
            padding: 20px;
            color: #333;
        }

        .form-container {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border: 2px solid var(--border-color);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        /* 標頭樣式 */
        .form-header {
            text-align: center;
            border-bottom: 2px double var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .form-header h1 {
            margin: 0;
            font-size: 24px;
            letter-spacing: 2px;
            color: var(--primary-color);
        }

        .form-header .sub-title {
            font-size: 14px;
            color: #666;
            margin-top: 5px;
        }

        /* 異常提醒警示框 */
        .alert-box {
            background-color: var(--alert-bg);
            border: 1px solid var(--alert-border);
            color: var(--alert-text);
            padding: 12px 15px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .alert-box strong {
            color: #856404;
        }

        /* 表格通用樣式 (請款單風格) */
        table.form-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }

        table.form-table th, table.form-table td {
            border: 1px solid var(--border-color);
            padding: 8px 10px;
            font-size: 14px;
        }

        table.form-table th {
            background-color: var(--light-bg);
            text-align: center;
            font-weight: bold;
            color: var(--primary-color);
        }

        /* 輸入控制項樣式 */
        input[type="text"], input[type="date"], input[type="time"], input[type="number"], select, textarea {
            width: 100%;
            padding: 6px;
            border: 1px solid #ccc;
            border-radius: 3px;
            box-sizing: border-box;
            font-size: 13px;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #2980b9;
            outline: none;
            background-color: #f0f8ff;
        }

        /* 按鈕樣式 */
        .btn {
            padding: 6px 12px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
        }

        .btn-add {
            background-color: #27ae60;
            color: white;
            margin-bottom: 10px;
        }

        .btn-add:hover { background-color: #219150; }

        .btn-danger {
            background-color: #e74c3c;
            color: white;
            padding: 4px 8px;
        }

        .btn-danger:hover { background-color: #c0392b; }

        .btn-submit {
            background-color: var(--primary-color);
            color: white;
            padding: 10px 30px;
            font-size: 16px;
        }

        .btn-submit:hover { background-color: #1a252f; }

        .text-center { text-align: center; }
        .text-right { text-align: right; }

        /* 簽核欄位區 */
        .approval-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            border: 1px solid var(--border-color);
            margin-top: 20px;
        }

        .approval-box {
            border-right: 1px solid var(--border-color);
            text-align: center;
        }

        .approval-box:last-child {
            border-right: none;
        }

        .approval-title {
            background-color: var(--light-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 6px;
            font-weight: bold;
            font-size: 13px;
        }

        .approval-space {
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #aaa;
            font-size: 12px;
        }

        @media print {
            body { background: white; padding: 0; }
            .form-container { box-shadow: none; border: 1px solid #000; }
            .btn, .alert-box { display: none; }
        }
    </style>
</head>
<body>

<div class="form-container">
    <!-- 單據頭部 -->
    <div class="form-header">
        <h1>出缺勤 / 請假 / 加班 申請單</h1>
        <div class="sub-title">請款單式結構 - 考勤與異常補請填報</div>
    </div>

    <!-- 考勤異常提醒（模擬系統自動帶入） -->
    <div class="alert-box" id="alertBox">
        <div>
            <strong>⚠️ 考勤異常提醒：</strong> 系統偵測到您於 <span style="text-decoration: underline;">2026/09/08</span> 有刷卡簽退紀錄但無上班打卡，請於此單據完成「補打卡」或「請假說明」。
        </div>
        <button class="btn btn-danger" onclick="document.getElementById('alertBox').style.display='none'">關閉提醒</button>
    </div>

    <form id="attendanceForm" onsubmit="handleSubmit(event)">
        <!-- 表頭 basic info (基本資訊表) -->
        <table class="form-table">
            <tr>
                <th width="15%">填單日期</th>
                <td width="35%"><input type="date" id="applyDate" required></td>
                <th width="15%">單據編號</th>
                <td width="35%"><input type="text" id="formNo" value="ATT-20260909-001" readonly style="background:#eee;"></td>
            </tr>
            <tr>
                <th>申請人</th>
                <td><input type="text" placeholder="請輸入姓名" required></td>
                <th>所屬部門</th>
                <td>
                    <select required>
                        <option value="">-- 請選擇部門 --</option>
                        <option value="行政管理部">行政管理部</option>
                        <option value="財務會計部">財務會計部</option>
                        <option value="工程技術部">工程技術部</option>
                        <option value="專案規劃部">专案規劃部</option>
                    </select>
                </td>
            </tr>
        </table>

        <!-- 申請明細表 (如同請款明細) -->
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h3 style="margin: 10px 0; font-size: 16px; color: var(--primary-color);">丨 申請項目明細</h3>
            <button type="button" class="btn btn-add" onclick="addRow()">+ 新增明細欄位</button>
        </div>

        <table class="form-table" id="detailTable">
            <thead>
                <tr>
                    <th width="14%">申請類別</th>
                    <th width="14%">假別/項目</th>
                    <th width="18%">開始時間</th>
                    <th width="18%">結束時間</th>
                    <th width="10%">時數(HR)</th>
                    <th width="20%">事由 / 專案備註</th>
                    <th width="6%">操作</th>
                </tr>
            </thead>
            <tbody id="detailBody">
                <!-- 動態新增列 -->
            </tbody>
            <tfoot>
                <tr>
                    <td colspan="4" class="text-right" style="font-weight: bold; background: var(--light-bg);">合計時數：</td>
                    <td class="text-center" style="font-weight: bold; color: #c0392b;" id="totalHours">0</td>
                    <td colspan="2"></td>
                </tr>
            </tfoot>
        </table>

        <!-- 備註與說明 -->
        <table class="form-table">
            <tr>
                <th width="15%">檢附證明/備註</th>
                <td>
                    <input type="file" multiple style="margin-bottom: 5px;"><br>
                    <small style="color: #666;">* 如請公假、病假、喪假等，請上傳相關證明文件電子檔。</small>
                </td>
            </tr>
        </table>

        <!-- 底部簽核欄 (請款單標準樣式) -->
        <div class="approval-grid">
            <div class="approval-box">
                <div class="approval-title">申請人</div>
                <div class="approval-space">（簽章填表）</div>
            </div>
            <div class="approval-box">
                <div class="approval-title">部門主管</div>
                <div class="approval-space">（待審核）</div>
            </div>
            <div class="approval-box">
                <div class="approval-title">考勤HR覆核</div>
                <div class="approval-space">（待核對）</div>
            </div>
            <div class="approval-box">
                <div class="approval-title">管理階層核決</div>
                <div class="approval-space">（待批示）</div>
            </div>
        </div>

        <!-- 送出按鈕區 -->
        <div class="text-center" style="margin-top: 25px;">
            <button type="submit" class="btn btn-submit">送出申請單</button>
            <button type="button" class="btn" style="background: #7f8c8d; color: white;" onclick="window.print()">列印單據</button>
        </div>
    </form>
</div>

<script>
    // 預設填單日期為今天
    document.getElementById('applyDate').valueAsDate = new Date();

    // 項目與假別連動選單
    const itemOptions = {
        "請假": ["特別休假", "事假", "普通傷病假", "公假", "婚假", "喪假", "生理假", "補休"],
        "加班": ["工作日加班", "休息日加班", "例假日加班"],
        "缺勤/補打卡": ["上班補打卡", "下班補打卡", "外出公差補打卡"]
    };

    // 自動新增第一筆空明細
    window.onload = function() {
        addRow();
    };

    // 新增列
    function addRow() {
        const tbody = document.getElementById('detailBody');
        const row = document.createElement('tr');

        row.innerHTML = `
            <td>
                <select onchange="updateSubOptions(this)" required>
                    <option value="請假">請假</option>
                    <option value="加班">加班</option>
                    <option value="缺勤/補打卡">缺勤/補打卡</option>
                </select>
            </td>
            <td>
                <select class="sub-type" required>
                    <!-- 自動動態帶入 -->
                </select>
            </td>
            <td><input type="datetime-local" class="start-time" onchange="calculateHours(this)" required></td>
            <td><input type="datetime-local" class="end-time" onchange="calculateHours(this)" required></td>
            <td><input type="number" class="row-hours" value="0" min="0" step="0.5" onchange="calculateTotal()" readonly style="background:#f9f9f9; text-align:center;"></td>
            <td><input type="text" placeholder="填寫說明或專案名稱" required></td>
            <td class="text-center"><button type="button" class="btn btn-danger" onclick="removeRow(this)">X</button></td>
        `;

        tbody.appendChild(row);
        updateSubOptions(row.querySelector('select'));
    }

    // 移除列
    function removeRow(btn) {
        const row = btn.closest('tr');
        row.remove();
        calculateTotal();
    }

    // 連動選單更新
    function updateSubOptions(selectElem) {
        const category = selectElem.value;
        const row = selectElem.closest('tr');
        const subSelect = row.querySelector('.sub-type');
        
        subSelect.innerHTML = '';
        itemOptions[category].forEach(item => {
            const opt = document.createElement('option');
            opt.value = item;
            opt.textContent = item;
            subSelect.appendChild(opt);
        });
    }

    // 自動計算時數 (預設簡單扣除時間差，可依公司班表調整邏輯)
    function calculateHours(inputElem) {
        const row = inputElem.closest('tr');
        const startVal = row.querySelector('.start-time').value;
        const endVal = row.querySelector('.end-time').value;
        const hoursInput = row.querySelector('.row-hours');

        if (startVal && endVal) {
            const start = new Date(startVal);
            const end = new Date(endVal);
            const diffMs = end - start;

            if (diffMs > 0) {
                let hours = diffMs / (1000 * 60 * 60);
                hoursInput.value = hours.toFixed(1);
            } else {
                alert('結束時間必須大於開始時間！');
                hoursInput.value = 0;
            }
        }
        calculateTotal();
    }

    // 計算總時數
    function calculateTotal() {
        let total = 0;
        const hoursInputs = document.querySelectorAll('.row-hours');
        hoursInputs.forEach(input => {
            total += parseFloat(input.value) || 0;
        });
        document.getElementById('totalHours').textContent = total.toFixed(1);
    }

    // 表單送出處置
    function handleSubmit(e) {
        e.preventDefault();
        alert('申請單已成功送出！將傳送至主管審核。');
    }
</script>

</body>
</html>
